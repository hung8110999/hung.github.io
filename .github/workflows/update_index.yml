name: Update Posts Index

on:
  push:
    paths:
      - 'markdown_posts/**'
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Generate posts and posts.json
        run: python scripts/convert.py

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posts.json
          git add posts/
          git commit -m "Auto-generate blog posts and index" || echo "No changes to commit"
          git push
